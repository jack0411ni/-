<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 六都市長選情預測戰情室</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-16">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white">🗳️ 2026 六都選情預測</h1>
        <p class="text-xs text-slate-400">純娛樂預測｜流派 B（全六都數軸誤差）</p>
      </div>
      <button id="btnAdminToggle" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
        ⚙️ 站長開獎
      </button>
    </div>

    <!-- 分頁切換 -->
    <div class="max-w-4xl mx-auto px-4 flex gap-2 pb-2">
      <button id="tabBet" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition">我要預測</button>
      <button id="tabBoard" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">即時戰情室</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-5">

    <!-- 狀態提示條 -->
    <div id="statusBanner" class="mb-4 p-3 rounded-xl bg-slate-900 border border-slate-800 text-sm flex flex-wrap items-center justify-between gap-2">
      <span id="deadlineText" class="text-amber-400 font-medium">⏳ 截止時間：2026/11/28 16:00</span>
      <span id="participantCount" class="text-slate-400">目前參與：載入中...</span>
    </div>

    <!-- ==================== 分頁 1：我要預測 ==================== -->
    <section id="viewBet" class="space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
        <label class="block text-sm font-medium text-slate-300 mb-1.5">你的暱稱（開獎排行榜顯示用）</label>
        <input id="playerName" type="text" maxlength="16" placeholder="例如：台中阿明"
          class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500" />
      </div>

      <div id="betCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

      <div class="pt-2">
        <button id="btnSubmitBet"
          class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-400 font-bold text-base shadow-lg transition">
          送出我的六都預測
        </button>
        <p id="submitMsg" class="text-center text-sm mt-2 min-h-[20px]"></p>
      </div>
    </section>

    <!-- ==================== 分頁 2：即時戰情室 ==================== -->
    <section id="viewBoard" class="hidden space-y-6">

      <!-- 官方開票進度看板 -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold text-base">📢 六都開票結果與群眾風向</h2>
          <a href="https://www.cec.gov.tw/" target="_blank" class="text-xs text-indigo-400 hover:underline">前往中選會官網 ↗</a>
        </div>
        <div id="liveCitiesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      </div>

      <!-- 即時排行榜 -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <h2 class="font-bold text-base">🏆 即時預測排行榜 <span class="text-xs font-normal text-indigo-400 ml-1">（僅可點擊查看自己的預測）</span></h2>
          <span class="text-xs text-slate-400">排序：猜中都數 ＞ 總誤差
